name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: Check the tag and run the tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: |
          version=$(sed -n 's/^ \* Version: *//p' velirapay-woocommerce.php | head -n 1)
          constant=$(sed -n "s/^ *public const VERSION = '\([^']*\)';/\1/p" src/Plugin.php | head -n 1)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ] || [ "${constant}" != "${version}" ] || [ "${stable}" != "${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME}, the plugin's version ${version}, Plugin::VERSION ${constant} and the stable tag in readme.txt, ${stable}, must match." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The tag ${GITHUB_REF_NAME} points at a commit that is not on main." >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: find velirapay-woocommerce.php src tests -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the plugin
        run: |
          zip=$(bash bin/build.sh)
          unzip -q "${zip}" -d build

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/velirapay-for-woocommerce
          slug: velirapay-for-woocommerce
          # An empty token skips the pull request comment, which this job's read-only token could not post.
          repo-token: ''

  release:
    name: Release the plugin zip
    needs: [checks, plugin-check]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the zip
        run: bash bin/build.sh

      - name: Write the release notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; if (index($0, "## " version " ") == 1) { found = 1; next } } found { print }' CHANGELOG.md | sed -e '/./,$!d' > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "build/velirapay-for-woocommerce-${GITHUB_REF_NAME#v}.zip" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"

  wordpress-org:
    name: Deploy to WordPress.org
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Secrets cannot decide whether a job runs, so its steps are skipped while they are not set, and the job passes.
      - name: Check for the SVN credentials
        id: credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -n "${SVN_USERNAME}" ] && [ -n "${SVN_PASSWORD}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=Not deployed to WordPress.org::The SVN_USERNAME and SVN_PASSWORD secrets are not set, so ${GITHUB_REF_NAME} was only released on GitHub."
          fi

      - name: Checkout code
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the plugin
        if: steps.credentials.outputs.configured == 'true'
        run: |
          zip=$(bash bin/build.sh)
          unzip -q "${zip}" -d build

      - name: Deploy to WordPress.org
        if: steps.credentials.outputs.configured == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: velirapay-for-woocommerce
          BUILD_DIR: build/velirapay-for-woocommerce
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
