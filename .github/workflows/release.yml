name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release the plugin zip
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          version=$(sed -n 's/^ \* Version: *//p' velirapay-woocommerce.php | head -n 1)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ] || [ "${stable}" != "${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME}, the plugin's version ${version} and the stable tag in readme.txt, ${stable}, must match." >&2
            exit 1
          fi

      - name: Build the zip
        run: bash bin/build.sh

      - name: Write the release notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '/^## / { if (found) exit; if (index($0, "## " version " ") == 1) { found = 1; next } } found { print }' CHANGELOG.md | sed -e '/./,$!d' > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "build/velirapay-woocommerce-${GITHUB_REF_NAME#v}.zip" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file build/notes.md
